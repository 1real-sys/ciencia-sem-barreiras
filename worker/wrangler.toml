name = "ciencia-sem-barreiras-admin"
account_id = "3e63e0d7e0470912941e840596ff7ca4"
main = "src/index.ts"
compatibility_date = "2026-11-04"
[observability]
enabled = true
head_sampling_rate = 1
[observability.logs]
enabled = true
invocation_logs = true
[vars]
ALLOWED_ORIGINS = "https://1real-sys.github.io,http://localhost:4200,http://localhost:4173"
EXTERNAL_MEDIA_HOSTS = ""
[[ratelimits]]
name = "PUBLIC_REQUESTS"
namespace_id = "1001"
# Shared school Wi-Fi: this budget covers all visitors behind the same public IP.
simple = { limit = 6000, period = 60 }
[[ratelimits]]
name = "ADMIN_REQUESTS"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]
[triggers]
crons = ["17 3 * * *"]
